// ── NATURAL BRUSH (color variation + smudge) ──
function hexToHsl(hex){
  let r=parseInt(hex.slice(1,3),16)/255,g=parseInt(hex.slice(3,5),16)/255,b=parseInt(hex.slice(5,7),16)/255;
  const max=Math.max(r,g,b),min=Math.min(r,g,b);
  let h=0,s=0,l=(max+min)/2;
  if(max!==min){
    const d=max-min;
    s=l>0.5?d/(2-max-min):d/(max+min);
    if(max===r)h=((g-b)/d+(g<b?6:0));
    else if(max===g)h=(b-r)/d+2;
    else h=(r-g)/d+4;
    h*=60;
  }
  return[h,s*100,l*100];
}
function hslToHex(h,s,l){
  s/=100;l/=100;
  const c=(1-Math.abs(2*l-1))*s, x=c*(1-Math.abs((h/60)%2-1)), m=l-c/2;
  let r,g,b;
  if(h<60){r=c;g=x;b=0;} else if(h<120){r=x;g=c;b=0;}
  else if(h<180){r=0;g=c;b=x;} else if(h<240){r=0;g=x;b=c;}
  else if(h<300){r=x;g=0;b=c;} else {r=c;g=0;b=x;}
  const R=Math.round((r+m)*255),G=Math.round((g+m)*255),B=Math.round((b+m)*255);
  return '#'+[R,G,B].map(v=>v.toString(16).padStart(2,'0')).join('');
}
let naturalIntensity=50; // 0-100, controls hue/sat/light jitter AND smudge strength
function setNaturalIntensity(v){
  naturalIntensity=+v;
  document.getElementById('naturalVal').textContent=v+'%';
}

function naturalDabColor(){
  const[h,s,l]=hexToHsl(color);
  const k=naturalIntensity/50; // 1.0 at default 50%
  const dh=(Math.random()-0.5)*16*k;
  const ds=(Math.random()-0.5)*20*k;
  const dl=(Math.random()-0.5)*22*k;
  return hslToHex(
    (h+dh+360)%360,
    Math.max(0,Math.min(100,s+ds)),
    Math.max(8,Math.min(92,l+dl))
  );
}
function naturalDab(x,y){
  const r=Math.max(1,thickness*0.7);
  ctx.save();
  ctx.globalAlpha=0.55+Math.random()*0.3;
  ctx.fillStyle=naturalDabColor();
  ctx.beginPath();ctx.arc(x,y,r*(0.7+Math.random()*0.6),0,Math.PI*2);ctx.fill();
  ctx.restore();
}
function naturalLine(x0,y0,x1,y1){
  const dist=Math.hypot(x1-x0,y1-y0);
  const steps=Math.max(1,Math.ceil(dist/Math.max(2,thickness*0.25)));
  for(let i=0;i<=steps;i++){
    const t=i/steps;
    naturalDab(x0+(x1-x0)*t, y0+(y1-y0)*t);
  }
}
// Smudge: sample a small patch slightly behind the stroke and blend it forward
function smudgeStep(x0,y0,x1,y1){
  const r=Math.max(3,thickness*0.9);
  const dx=x1-x0,dy=y1-y0,dist=Math.hypot(dx,dy)||1;
  const ux=dx/dist, uy=dy/dist;
  // sample source patch slightly behind the new point
  const sx=Math.max(r,Math.min(MC.width-r, x0));
  const sy=Math.max(r,Math.min(MC.height-r, y0));
  try{
    const patch=ctx.getImageData(Math.round(sx-r),Math.round(sy-r),Math.round(r*2),Math.round(r*2));
    ctx.save();
    ctx.globalAlpha=0.15+0.4*(naturalIntensity/100);
    ctx.beginPath();ctx.arc(x1,y1,r,0,Math.PI*2);ctx.clip();
    ctx.putImageData(patch, Math.round(x1-r), Math.round(y1-r));
    ctx.restore();
  }catch(e){}
}

// ── ERASER VISUAL TRAIL (drawn on selCanvas overlay) ──
function updateEraserCursorSize(){ /* handled via drawEraserDot on selCanvas */ }
function hideEraserCursor(){ clearEraserTrail(); }

function drawEraserDot(x,y){
  const d=thickness*8;
  sCtx.clearRect(0,0,SC.width,SC.height);
  drawGuideLines();
  sCtx.save();
  sCtx.globalAlpha=1;
  sCtx.globalCompositeOperation='source-over';
  sCtx.fillStyle='rgba(220,220,220,0.75)';
  sCtx.strokeStyle='rgba(100,100,100,0.9)';
  sCtx.lineWidth=2;
  sCtx.beginPath();
  sCtx.arc(x,y,Math.max(4,d/2),0,Math.PI*2);
  sCtx.fill();
  sCtx.stroke();
  sCtx.restore();
}
function clearEraserTrail(){
  sCtx.clearRect(0,0,SC.width,SC.height);
  drawGuideLines();
}

function onDown(e){
  e.preventDefault();
  if(mode==='zoom') return;
  selPinchPtrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(selRect&&selPinchPtrs.size>=2){drawing=false;return;}
  closeSpectrum();
  if(piece && activePieceControl) closePieceControlRow();
  if(mode==='text'){handleTextClick(e);return;}
  if(mode==='move') return;
  if(mode==='eyedrop'){
    const[x,y]=getPos(e);
    // sample single pixel immediately on tap
    const px=Math.round(x), py=Math.round(y);
    if(px>=0&&py>=0&&px<MC.width&&py<MC.height){
      const d=ctx.getImageData(px,py,1,1).data;
      const hex='#'+[d[0],d[1],d[2]].map(v=>v.toString(16).padStart(2,'0')).join('');
      setColorFromHex(hex);
      showToast('💉 '+hex);
    }
    return;
  }
  if(mode==='scatter'){
    const[x,y]=getPos(e);
    doScatterFill(x,y);
    return;
  }
  if(mode==='fill'){saveHistory();floodFill(e);return;}
  if(mode==='rect'||mode==='lasso'){startSel(e);return;}
  if(mode==='shape'){
    const[x,y]=getPos(e);
    saveHistory();shapeStart={x,y};
    try{MC.setPointerCapture(e.pointerId);}catch(ex){}
    return;
  }
  try{MC.setPointerCapture(e.pointerId);}catch(ex){}
  saveHistory();drawing=true;
  [lastX,lastY]=getPos(e);
  if(mode==='eraser') drawEraserDot(lastX,lastY);
}

function onMove(e){
  e.preventDefault();
  if(mode==='zoom') return;
  if(selRect&&selPinchPtrs.size>=2){
    selPinchPtrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    handleSelPinch(e);
    return;
  }
  if(mode==='rect'||mode==='lasso'){updateSel(e);return;}
  const dc=getCtx(); // drawing context
  if(mode==='shape'&&shapeStart){
    const[x,y]=getPos(e);
    dc.putImageData(undoStack[undoStack.length-1],0,0);
    drawShape(shapeStart.x,shapeStart.y,x,y,false);
    return;
  }
  if(!drawing)return;
  const[x,y]=getPos(e);
  if(mode==='natural'){
    naturalLine(lastX,lastY,x,y);
    smudgeStep(lastX,lastY,x,y);
    [lastX,lastY]=[x,y];
    return;
  }
  dc.lineCap='round';dc.lineJoin='round';
  if(mode==='eraser'){
    dc.strokeStyle='#fff';dc.lineWidth=thickness*8;
    mirrorLine(lastX,lastY,x,y);
    drawEraserDot(x,y);
    [lastX,lastY]=[x,y];
    return;
  }
  dc.strokeStyle=color;dc.lineWidth=thickness;
  mirrorLine(lastX,lastY,x,y);
  [lastX,lastY]=[x,y];
}

function onUp(e){
  e.preventDefault();
  selPinchPtrs.delete(e.pointerId);
  if(selPinchPtrs.size<2){selPinchDist=null;selPinchRect=null;}
  if(mode==='eraser') clearEraserTrail();
  if(mode==='zoom') return;
  if(mode==='rect'||mode==='lasso'){finishSel(e);return;}
  if(mode==='shape'&&shapeStart){
    const[x,y]=getPos(e);
    ctx.putImageData(undoStack[undoStack.length-1],0,0);
    drawShape(shapeStart.x,shapeStart.y,x,y,true);
    shapeStart=null;
    drawing=false;
    return;
  }
  // draw dot on tap (no movement)
  if(drawing){
    const[x,y]=getPos(e);
    if(Math.hypot(x-lastX,y-lastY)<3){
      if(mode==='natural') naturalDab(lastX,lastY);
      else{
        const r=Math.max(0.5,(mode==='eraser'?thickness*4:thickness)/2);
        ctx.fillStyle=mode==='eraser'?'#fff':color;
        mirrorDot(lastX,lastY,r);
      }
    }
  }
  drawing=false;
}

// ══════════════════════════════
//  SHAPE DRAWING
// ══════════════════════════════
function drawShape(x0,y0,x1,y1,final){
  const lw=thickness;
  ctx.strokeStyle=color;ctx.fillStyle=color;
  ctx.lineWidth=lw;ctx.lineCap='round';ctx.lineJoin='round';

  // for each mirror combination
  mirrorPoints(x0,y0).forEach((p,i)=>{
    const q=mirrorPoints(x1,y1)[i];
    const ax=p.x,ay=p.y,bx=q.x,by=q.y;
    const cx=(ax+bx)/2,cy=(ay+by)/2;
    const rw=Math.abs(bx-ax)/2,rh=Math.abs(by-ay)/2,r=Math.min(rw,rh);
    ctx.beginPath();
    switch(shapeType){
      case 'line':
        ctx.moveTo(ax,ay);ctx.lineTo(bx,by);
        if(fillMode==='hatch')ctx.setLineDash([hatchGapVal,hatchGapVal]);
        ctx.stroke();ctx.setLineDash([]);break;
      case 'rect':
        if(fillMode==='solid'){ctx.fillRect(Math.min(ax,bx),Math.min(ay,by),Math.abs(bx-ax),Math.abs(by-ay));}
        if(fillMode==='hatch')ctx.setLineDash([hatchGapVal,hatchGapVal]);
        ctx.strokeRect(Math.min(ax,bx),Math.min(ay,by),Math.abs(bx-ax),Math.abs(by-ay));
        ctx.setLineDash([]);break;
      case 'ellipse':
        ctx.ellipse(cx,cy,Math.max(1,rw),Math.max(1,rh),0,0,Math.PI*2);
        if(fillMode==='solid')ctx.fill();
        if(fillMode==='hatch')ctx.setLineDash([hatchGapVal,hatchGapVal]);
        ctx.stroke();ctx.setLineDash([]);break;
      case 'circle':{
        ctx.arc(cx,cy,Math.max(1,r),0,Math.PI*2);
        if(fillMode==='solid')ctx.fill();
        if(fillMode==='hatch')ctx.setLineDash([hatchGapVal,hatchGapVal]);
        ctx.stroke();ctx.setLineDash([]);break;}
      case 'triangle':{
        const mx=(ax+bx)/2;
        ctx.moveTo(mx,ay);ctx.lineTo(bx,by);ctx.lineTo(ax,by);ctx.closePath();
        if(fillMode==='solid')ctx.fill();
        if(fillMode==='hatch')ctx.setLineDash([hatchGapVal,hatchGapVal]);
        ctx.stroke();ctx.setLineDash([]);break;}
      case 'rtriangle':
        ctx.moveTo(ax,ay);ctx.lineTo(ax,by);ctx.lineTo(bx,by);ctx.closePath();
        if(fillMode==='solid')ctx.fill();
        if(fillMode==='hatch')ctx.setLineDash([hatchGapVal,hatchGapVal]);
        ctx.stroke();ctx.setLineDash([]);break;
      case 'diamond':{
        const mx2=(ax+bx)/2,my2=(ay+by)/2;
        ctx.moveTo(mx2,ay);ctx.lineTo(bx,my2);ctx.lineTo(mx2,by);ctx.lineTo(ax,my2);ctx.closePath();
        if(fillMode==='solid')ctx.fill();
        if(fillMode==='hatch')ctx.setLineDash([hatchGapVal,hatchGapVal]);
        ctx.stroke();ctx.setLineDash([]);break;}
      case 'star':{
        const cx2=(ax+bx)/2,cy2=(ay+by)/2;
        const ro=Math.min(Math.abs(bx-ax),Math.abs(by-ay))/2;
        const ri=ro*0.4;
        for(let k=0;k<5;k++){
          const a1=Math.PI/2+k*2*Math.PI/5*(-1); // clockwise
          const a2=a1+Math.PI/5*(-1);
          if(k===0) ctx.moveTo(cx2+ro*Math.cos(-Math.PI/2),cy2+ro*Math.sin(-Math.PI/2));
          ctx.lineTo(cx2+ro*Math.cos(-Math.PI/2+k*2*Math.PI/5),cy2+ro*Math.sin(-Math.PI/2+k*2*Math.PI/5));
          ctx.lineTo(cx2+ri*Math.cos(-Math.PI/2+(k+0.5)*2*Math.PI/5),cy2+ri*Math.sin(-Math.PI/2+(k+0.5)*2*Math.PI/5));
        }
        ctx.closePath();if(shapeFill)ctx.fill();ctx.stroke();break;}
      case 'arrow':{
        const dx=bx-ax,dy=by-ay,len=Math.sqrt(dx*dx+dy*dy)||1;
        const ux=dx/len,uy=dy/len;
        const hw=Math.max(lw*3,12),hl=Math.min(len*0.35,hw*1.8);
        const bx2=bx-ux*hl,by2=by-uy*hl;
        ctx.moveTo(ax,ay);ctx.lineTo(bx2,by2);ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(bx,by);
        ctx.lineTo(bx2-uy*hw,by2+ux*hw);
        ctx.lineTo(bx2+uy*hw,by2-ux*hw);
        ctx.closePath();if(shapeFill)ctx.fill();ctx.stroke();break;}
      case 'heart':{
        const hx=(ax+bx)/2,hy=Math.min(ay,by);
        const hw2=Math.abs(bx-ax)/2,hh=Math.abs(by-ay);
        ctx.moveTo(hx,hy+hh);
        ctx.bezierCurveTo(hx-hw2*1.5,hy+hh*0.5, hx-hw2*1.8,hy-hh*0.2, hx,hy+hh*0.1);
        ctx.bezierCurveTo(hx+hw2*1.8,hy-hh*0.2, hx+hw2*1.5,hy+hh*0.5, hx,hy+hh);
        if(shapeFill)ctx.fill();ctx.stroke();break;}

      case 'polygon':{
        const pcx=(ax+bx)/2, pcy=(ay+by)/2;
        const prx=Math.abs(bx-ax)/2, pry=Math.abs(by-ay)/2;
        const n=polySides;
        for(let i=0;i<n;i++){
          const a=-Math.PI/2+i*2*Math.PI/n;
          const px2=pcx+prx*Math.cos(a), py2=pcy+pry*Math.sin(a);
          i===0?ctx.moveTo(px2,py2):ctx.lineTo(px2,py2);
        }
        ctx.closePath();
        if(fillMode==='solid')ctx.fill();
        if(fillMode==='hatch')ctx.setLineDash([hatchGapVal,hatchGapVal]);
        ctx.stroke();ctx.setLineDash([]);break;}

      case 'cube':{
        const W=Math.abs(bx-ax),H=Math.abs(by-ay);
        const ox2=W*0.28,oy2=H*0.28;
        const lx=Math.min(ax,bx),ty2=Math.min(ay,by);
        const fr={x:lx,y:ty2+oy2,w:W*0.72,h:H*0.72};
        // front
        ctx.strokeRect(fr.x,fr.y,fr.w,fr.h);
        if(fillMode==='solid')ctx.fillRect(fr.x,fr.y,fr.w,fr.h);
        // top
        ctx.beginPath();ctx.moveTo(fr.x,fr.y);ctx.lineTo(fr.x+ox2,ty2);
        ctx.lineTo(fr.x+ox2+fr.w,ty2);ctx.lineTo(fr.x+fr.w,fr.y);ctx.closePath();
        ctx.stroke();if(fillMode==='solid'){ctx.save();ctx.globalAlpha*=0.8;ctx.fill();ctx.restore();}
        // right
        ctx.beginPath();ctx.moveTo(fr.x+fr.w,fr.y);ctx.lineTo(fr.x+ox2+fr.w,ty2);
        ctx.lineTo(fr.x+ox2+fr.w,ty2+fr.h);ctx.lineTo(fr.x+fr.w,fr.y+fr.h);ctx.closePath();
        ctx.stroke();if(fillMode==='solid'){ctx.save();ctx.globalAlpha*=0.6;ctx.fill();ctx.restore();}
        break;}

      case 'cylinder':{
        const cw=Math.abs(bx-ax),ch=Math.abs(by-ay);
        const clx=Math.min(ax,bx),cty=Math.min(ay,by);
        const ery=Math.max(4,ch*0.14);
        // left and right sides
        ctx.beginPath();
        ctx.moveTo(clx,cty+ery);
        ctx.lineTo(clx,cty+ch-ery);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(clx+cw,cty+ery);
        ctx.lineTo(clx+cw,cty+ch-ery);
        ctx.stroke();
        // bottom full ellipse
        ctx.beginPath();
        ctx.ellipse(clx+cw/2,cty+ch-ery,cw/2,ery,0,0,Math.PI*2);
        if(fillMode==='solid'){ctx.save();ctx.globalAlpha*=0.85;ctx.fill();ctx.restore();}
        if(fillMode==='hatch')ctx.setLineDash([hatchGapVal,hatchGapVal]);
        ctx.stroke();ctx.setLineDash([]);
        // top full ellipse
        ctx.beginPath();
        ctx.ellipse(clx+cw/2,cty+ery,cw/2,ery,0,0,Math.PI*2);
        if(fillMode==='solid'){ctx.save();ctx.globalAlpha*=0.95;ctx.fill();ctx.restore();}
        if(fillMode==='hatch')ctx.setLineDash([hatchGapVal,hatchGapVal]);
        ctx.stroke();ctx.setLineDash([]);
        // fill body
        if(fillMode==='solid'){
          ctx.save();ctx.globalAlpha*=0.6;
          ctx.fillRect(clx,cty+ery,cw,ch-2*ery);
          ctx.restore();
        }
        break;}

      case 'cone':{
        const cnw=Math.abs(bx-ax),cnh=Math.abs(by-ay);
        const cnlx=Math.min(ax,bx),cnty=Math.min(ay,by);
        const cer=Math.max(4,cnh*0.12);
        ctx.beginPath();ctx.moveTo(cnlx+cnw/2,cnty);ctx.lineTo(cnlx,cnty+cnh-cer);
        ctx.ellipse(cnlx+cnw/2,cnty+cnh-cer,cnw/2,cer,0,Math.PI,0);
        ctx.lineTo(cnlx+cnw/2,cnty);
        if(fillMode==='solid'){ctx.save();ctx.globalAlpha*=0.8;ctx.fill();ctx.restore();}
        ctx.stroke();
        ctx.beginPath();ctx.ellipse(cnlx+cnw/2,cnty+cnh-cer,cnw/2,cer,0,0,Math.PI*2);ctx.stroke();
        break;}

      case 'pyramid':{
        const pw=Math.abs(bx-ax),ph=Math.abs(by-ay);
        const plx=Math.min(ax,bx),pty=Math.min(ay,by);
        const apex2={x:plx+pw/2,y:pty};
        const bl2={x:plx,y:pty+ph},br2={x:plx+pw,y:pty+ph};
        const bm2={x:plx+pw*0.72,y:pty+ph*0.75};
        ctx.beginPath();ctx.moveTo(apex2.x,apex2.y);ctx.lineTo(bl2.x,bl2.y);ctx.lineTo(br2.x,br2.y);ctx.closePath();
        if(fillMode==='solid'){ctx.save();ctx.globalAlpha*=0.85;ctx.fill();ctx.restore();}ctx.stroke();
        ctx.beginPath();ctx.moveTo(apex2.x,apex2.y);ctx.lineTo(br2.x,br2.y);ctx.lineTo(bm2.x,bm2.y);ctx.closePath();
        if(fillMode==='solid'){ctx.save();ctx.globalAlpha*=0.55;ctx.fill();ctx.restore();}ctx.stroke();
        ctx.save();ctx.setLineDash([4,4]);
        ctx.beginPath();ctx.moveTo(apex2.x,apex2.y);ctx.lineTo(bm2.x,bm2.y);ctx.stroke();
        ctx.beginPath();ctx.moveTo(bl2.x,bl2.y);ctx.lineTo(bm2.x,bm2.y);ctx.stroke();
        ctx.setLineDash([]);ctx.restore();break;}
    }
  });
}

// ══════════════════════════════
//  SELECTION (rect + lasso) — drawing new selection
// ══════════════════════════════
function startSel(e){
  if(piece) stampPiece(); // commit old piece first
  clearSel();
  const[x,y]=getPos(e);
  selMode=mode; selStart={x,y};
  if(selMode==='lasso') lassoPoints=[{x,y}];
  try{MC.setPointerCapture(e.pointerId);}catch(ex){}
}
function updateSel(e){
  if(!selStart)return;
  const[x,y]=getPos(e);
  if(selMode==='rect'){
    const rx=Math.min(selStart.x,x),ry=Math.min(selStart.y,y);
    selRect={x:rx,y:ry,w:Math.abs(x-selStart.x),h:Math.abs(y-selStart.y)};
  } else {
    lassoPoints.push({x,y});
    const xs=lassoPoints.map(p=>p.x),ys=lassoPoints.map(p=>p.y);
    selRect={x:Math.min(...xs),y:Math.min(...ys),w:Math.max(...xs)-Math.min(...xs),h:Math.max(...ys)-Math.min(...ys)};
  }
  drawSelOverlay();
}
function finishSel(e){
  updateSel(e);selStart=null;
  if(!selRect||selRect.w<6||selRect.h<6){clearSel();return;}
  if(selMode==='lasso'&&lassoPoints.length>2) lassoPoints.push({...lassoPoints[0]});
  drawSelOverlay();
  updateHandles();
  showSelBar();
}

function drawSelOverlay(){
  sCtx.clearRect(0,0,SC.width,SC.height);
  drawGuideLines();
  if(!selRect)return;
  const{x,y,w,h}=selRect;
  sCtx.fillStyle='rgba(0,0,0,0.18)';sCtx.fillRect(0,0,SC.width,SC.height);
  sCtx.save();
  if(selMode==='lasso'&&lassoPoints&&lassoPoints.length>2){
    sCtx.beginPath();lassoPoints.forEach((p,i)=>i?sCtx.lineTo(p.x,p.y):sCtx.moveTo(p.x,p.y));sCtx.closePath();
    sCtx.globalCompositeOperation='destination-out';sCtx.fillStyle='rgba(0,0,0,1)';sCtx.fill();
    sCtx.restore();
    sCtx.beginPath();lassoPoints.forEach((p,i)=>i?sCtx.lineTo(p.x,p.y):sCtx.moveTo(p.x,p.y));sCtx.closePath();
    sCtx.strokeStyle='#e94560';sCtx.lineWidth=2;sCtx.setLineDash([6,4]);sCtx.stroke();sCtx.setLineDash([]);
  } else {
    sCtx.globalCompositeOperation='destination-out';sCtx.fillStyle='rgba(0,0,0,1)';sCtx.fillRect(x,y,w,h);
    sCtx.restore();
    sCtx.strokeStyle='#e94560';sCtx.lineWidth=2;sCtx.setLineDash([7,4]);sCtx.strokeRect(x,y,w,h);sCtx.setLineDash([]);
  }
  sCtx.restore();
}

function showSelBar(){
  if(!selRect) return;
  selBar.style.display='flex';
  selBar.style.bottom='var(--bar-h)';
  selBar.style.transform='none';
  selBar.classList.remove('minimized');
}

function clearSel(){
  selStart=null;selRect=null;lassoPoints=null;selMode='';
  sCtx.clearRect(0,0,SC.width,SC.height);
  drawGuideLines();
  selBar.style.display='none';
  selBar._dragged=false;
  updateHandles();
}
function deleteSel(){
  if(!selRect)return;
  saveHistory();
  eraseSel();
  clearSel();showToast('🗑️ נמחק');
}

function smartErase(){
  if(!selRect){ showToast('⚠️ בחר אזור תחילה'); return; }
  saveHistory();

  // capture ALL needed state synchronously before any async
  const SR={x:selRect.x, y:selRect.y, w:selRect.w, h:selRect.h};
  const SM=selMode;
  const LP=lassoPoints?lassoPoints.map(p=>({x:p.x,y:p.y})):null;

  showToast('🪄 ממלא... ('+Math.round(SR.w)+'×'+Math.round(SR.h)+'px)');

  // hide selection overlay but DON'T clear selRect yet
  sCtx.clearRect(0,0,SC.width,SC.height);
  selBar.style.display='none';

  setTimeout(()=>{
    const W=MC.width, H=MC.height;
    const x0=Math.max(0,Math.round(SR.x));
    const y0=Math.max(0,Math.round(SR.y));
    const w=Math.min(Math.round(SR.w), W-x0);
    const h=Math.min(Math.round(SR.h), H-y0);

    if(w<2||h<2){ showToast('⚠️ אזור קטן מדי'); return; }

    // build mask from captured state
    const mask=new Uint8Array(W*H);
    if(SM==='lasso'&&LP&&LP.length>2){
      const tmp=document.createElement('canvas');
      tmp.width=W; tmp.height=H;
      const tc=tmp.getContext('2d');
      tc.beginPath();
      LP.forEach((p,i)=>i?tc.lineTo(p.x,p.y):tc.moveTo(p.x,p.y));
      tc.closePath();
      tc.fillStyle='#fff';
      tc.fill();
      const md=tc.getImageData(0,0,W,H).data;
      for(let i=0;i<W*H;i++) if(md[i*4]>128) mask[i]=1;
    } else {
      for(let py=y0;py<y0+h;py++)
        for(let px=x0;px<x0+w;px++)
          mask[py*W+px]=1;
    }

    // count masked pixels
    let maskedCount=0;
    for(let i=0;i<W*H;i++) if(mask[i]) maskedCount++;
    if(maskedCount===0){ showToast('⚠️ לא נמצאו פיקסלים במסכה'); clearSel(); return; }

    const imgData=ctx.getImageData(0,0,W,H);
    const d=imgData.data;
    const orig=new Uint8ClampedArray(d);

    const PATCH=7, HALF=3;
    const SEARCH=Math.max(w,h,120);

    // BFS order from boundary inward
    const distMap=new Int32Array(W*H).fill(999999);
    const queue=[];
    for(let py=Math.max(0,y0-1);py<Math.min(H,y0+h+1);py++){
      for(let px=Math.max(0,x0-1);px<Math.min(W,x0+w+1);px++){
        if(!mask[py*W+px]) continue;
        let onBoundary=false;
        for(const[dx,dy] of [[-1,0],[1,0],[0,-1],[0,1]]){
          const nx=px+dx,ny=py+dy;
          if(nx>=0&&ny>=0&&nx<W&&ny<H&&!mask[ny*W+nx]){ onBoundary=true; break; }
        }
        if(onBoundary){ distMap[py*W+px]=0; queue.push([px,py]); }
      }
    }
    let qi=0;
    const order=[];
    while(qi<queue.length){
      const[px,py]=queue[qi++];
      order.push([px,py]);
      for(const[dx,dy] of [[-1,0],[1,0],[0,-1],[0,1]]){
        const nx=px+dx,ny=py+dy;
        if(nx<0||ny<0||nx>=W||ny>=H||!mask[ny*W+nx]) continue;
        if(distMap[ny*W+nx]>distMap[py*W+px]+1){
          distMap[ny*W+nx]=distMap[py*W+px]+1;
          queue.push([nx,ny]);
        }
      }
    }

    function patchSim(ax,ay,bx,by){
      let sum=0,n=0;
      for(let dy=-HALF;dy<=HALF;dy++){
        for(let dx=-HALF;dx<=HALF;dx++){
          const pax=ax+dx,pay=ay+dy;
          const pbx=bx+dx,pby=by+dy;
          if(pax<0||pay<0||pax>=W||pay>=H||pbx<0||pby<0||pbx>=W||pby>=H) continue;
          if(mask[pay*W+pax]) continue;
          const ia=(pay*W+pax)*4, ib=(pby*W+pbx)*4;
          const dr=orig[ia]-orig[ib],dg=orig[ia+1]-orig[ib+1],db2=orig[ia+2]-orig[ib+2];
          sum+=dr*dr+dg*dg+db2*db2; n++;
        }
      }
      return n<2?999999:sum/n;
    }

    for(const[px,py] of order){
      if(!mask[py*W+px]) continue;
      const sx0=Math.max(0,px-SEARCH), sx1=Math.min(W-1,px+SEARCH);
      const sy0=Math.max(0,py-SEARCH), sy1=Math.min(H-1,py+SEARCH);
      let best=[];
      for(let sy=sy0;sy<=sy1;sy+=3){
        for(let sx=sx0;sx<=sx1;sx+=3){
          if(mask[sy*W+sx]) continue;
          const pd=patchSim(px,py,sx,sy);
          if(pd<999999) best.push({pd,sx,sy});
        }
      }
      best.sort((a,b)=>a.pd-b.pd);
      const TOP=Math.min(3,best.length);
      const di=(py*W+px)*4;
      if(TOP===0){
        // fallback: nearest unmasked pixel
        for(let rr=1;rr<30;rr++){
          let found=false;
          for(let dy=-rr;dy<=rr&&!found;dy++) for(let dx=-rr;dx<=rr&&!found;dx++){
            const nx=px+dx,ny=py+dy;
            if(nx<0||ny<0||nx>=W||ny>=H||mask[ny*W+nx]) continue;
            const si=(ny*W+nx)*4;
            d[di]=orig[si];d[di+1]=orig[si+1];d[di+2]=orig[si+2];d[di+3]=255;
            found=true;
          }
          if(found) break;
        }
      } else {
        let r=0,g=0,b=0,wt=0;
        for(let i=0;i<TOP;i++){
          const w2=1/(best[i].pd+1);
          const si=(best[i].sy*W+best[i].sx)*4;
          r+=orig[si]*w2; g+=orig[si+1]*w2; b+=orig[si+2]*w2; wt+=w2;
        }
        d[di]=r/wt; d[di+1]=g/wt; d[di+2]=b/wt; d[di+3]=255;
      }
      mask[py*W+px]=0;
    }

    // feather boundary
    for(const[px,py] of order){
      if(distMap[py*W+px]>2) continue;
      const alpha=(distMap[py*W+px]+1)/3;
      const di=(py*W+px)*4;
      d[di]  =d[di]  *alpha+orig[di]  *(1-alpha);
      d[di+1]=d[di+1]*alpha+orig[di+1]*(1-alpha);
      d[di+2]=d[di+2]*alpha+orig[di+2]*(1-alpha);
    }

    ctx.putImageData(imgData,0,0);
    autosave();

    // now clear selection
    selRect=null; selStart=null; lassoPoints=null; selMode='';
    updateHandles();
    showToast('✅ מחיקה חכמה הושלמה! ('+maskedCount+'px)');
  }, 50);
}

function eraseSel(){
  // erase the selected shape from mainCanvas
  ctx.save();
  if(selMode==='lasso'&&lassoPoints&&lassoPoints.length>2){
    ctx.beginPath();lassoPoints.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.closePath();
    ctx.fillStyle='#fff';ctx.fill();
  } else if(selRect){
    ctx.fillStyle='#fff';ctx.fillRect(Math.round(selRect.x),Math.round(selRect.y),Math.round(selRect.w),Math.round(selRect.h));
  }
  ctx.restore();
}

// ══════════════════════════════
//  CUT PIECE
// ══════════════════════════════
function cutPiece(){
  if(!selRect)return;
  const bx=Math.round(selRect.x),by=Math.round(selRect.y);
  const bw=Math.max(1,Math.round(selRect.w)),bh=Math.max(1,Math.round(selRect.h));
  saveHistory();

  // 1. Copy pixels into piece canvas (with lasso mask if needed)
  const pieceTmp=document.createElement('canvas');
  pieceTmp.width=bw;pieceTmp.height=bh;
  const ptc=pieceTmp.getContext('2d');
  ptc.drawImage(MC,bx,by,bw,bh,0,0,bw,bh);

  if(selMode==='lasso'&&lassoPoints&&lassoPoints.length>2){
    // apply lasso mask
    ptc.save();
    ptc.globalCompositeOperation='destination-in';
    ptc.beginPath();lassoPoints.forEach(p=>ptc.lineTo(p.x-bx,p.y-by));ptc.closePath();
    ptc.fillStyle='#000';ptc.fill();
    ptc.restore();
  }

  const imgData=ptc.getImageData(0,0,bw,bh);

  // 2. Erase from main canvas
  eraseSel();

  // 3. Build piece object
  piece={
    imageData:imgData,
    origImageData:imgData,
    origX:bx,origY:by,w:bw,h:bh,
    _scaleOrigW:bw,_scaleOrigH:bh,
    floatX:bx,floatY:by,
    angle:0,flipHProg:0,flipVProg:0,
    blendMode:'source-over', opacity:1, xray:false,
    isDragging:false,dsx:0,dsy:0,dox:0,doy:0
  };

  clearSel();
  PC.style.display='block';
  PC.style.pointerEvents='auto';
  PC.style.cursor='grab';
  redrawPiece();
  showPieceBar();
  showToast('✂️ גזור! גרור להזזה ושחרר לקיבוע');
}

function copyPiece(){
  if(!selRect) return;
  const bx=Math.round(selRect.x), by=Math.round(selRect.y);
  const bw=Math.max(1,Math.round(selRect.w)), bh=Math.max(1,Math.round(selRect.h));

  // capture pixels — but DON'T erase from canvas
  const pieceTmp=document.createElement('canvas');
  pieceTmp.width=bw; pieceTmp.height=bh;
  const ptc=pieceTmp.getContext('2d');
  ptc.drawImage(MC,bx,by,bw,bh,0,0,bw,bh);

  if(selMode==='lasso'&&lassoPoints&&lassoPoints.length>2){
    ptc.save();
    ptc.globalCompositeOperation='destination-in';
    ptc.beginPath();lassoPoints.forEach(p=>ptc.lineTo(p.x-bx,p.y-by));ptc.closePath();
    ptc.fillStyle='#000';ptc.fill();
    ptc.restore();
  }

  const imgData=ptc.getImageData(0,0,bw,bh);

  // offset copy slightly so user sees it
  const offX=20, offY=20;
  piece={
    imageData:imgData,
    origImageData:imgData,
    origX:bx+offX, origY:by+offY,
    w:bw, h:bh,
    floatX:bx+offX, floatY:by+offY,
    angle:0,flipHProg:0,flipVProg:0,
    blendMode:'source-over', opacity:1,
    isDragging:false,dsx:0,dsy:0,dox:0,doy:0
  };

  clearSel();
  PC.style.display='block';
  PC.style.pointerEvents='auto';
  PC.style.cursor='grab';
  redrawPiece();
  showPieceBar();
  showToast('📋 הועתק! גרור להדבקה');
}

function showPieceBar(){
  if(!piece) return;
  showPieceEditUI();
  updateAngleBadge();
}

function resizePiece(axis, val){
  if(!piece) return;
  // scale imageData to new size
  const newW = axis==='w' ? Math.round(val) : piece.w;
  const newH = axis==='h' ? Math.round(val) : piece.h;
  // always scale from the ORIGINAL capture — never from a previously scaled version
  const tmp=document.createElement('canvas');
  tmp.width=piece.origImageData.width; tmp.height=piece.origImageData.height;
  tmp.getContext('2d').putImageData(piece.origImageData,0,0);
  const scaled=document.createElement('canvas');
  scaled.width=newW; scaled.height=newH;
  const sc=scaled.getContext('2d');
  sc.imageSmoothingEnabled=true;
  sc.imageSmoothingQuality='high';
  sc.drawImage(tmp,0,0,newW,newH);
  piece.imageData=sc.getImageData(0,0,newW,newH);
  // keep center fixed
  const cx=piece.floatX+piece.w/2;
  const cy=piece.floatY+piece.h/2;
  piece.w=newW; piece.h=newH;
  piece.floatX=cx-newW/2;
  piece.floatY=cy-newH/2;
  document.getElementById(axis==='w'?'pieceWVal':'pieceHVal').textContent=val;
  redrawPiece();
}

function cancelPiece(){
  // put piece back to original position and stamp
  if(piece){ piece.floatX=piece.origX; piece.floatY=piece.origY; stampPiece(); }
  hidePieceEditUI();
}

// Continuous page-flip: progress 0-100 → scale goes 1 → 0 → -1 (full mirror at 100)
function flipScale(progress){
  // cos curve: 0% -> 1, 100% -> -1, smooth through 0 at 50%
  return Math.cos((progress/100)*Math.PI);
}

function redrawPiece(){
  if(!piece)return;
  pCtx.clearRect(0,0,PC.width,PC.height);

  const cx=piece.floatX+piece.w/2;
  const cy=piece.floatY+piece.h/2;
  const rad=piece.angle*Math.PI/180;

  const src=document.createElement('canvas');
  src.width=piece.w; src.height=piece.h;
  src.getContext('2d').putImageData(piece.imageData,0,0);

  const blendMode=piece.blendMode||'source-over';
  const opacity=piece.xray ? 0.45 : (piece.opacity||1);

  if(blendMode!=='source-over'){
    // Real-time blend preview:
    // 1. copy the region from mainCanvas into a temp canvas
    // 2. draw piece over it with blendMode
    // 3. draw result onto pieceCanvas
    const tmp=document.createElement('canvas');
    tmp.width=piece.w; tmp.height=piece.h;
    const tc=tmp.getContext('2d');
    // copy background from mainCanvas
    tc.drawImage(MC, piece.floatX,piece.floatY,piece.w,piece.h, 0,0,piece.w,piece.h);
    // apply rotation/flip
    tc.save();
    tc.translate(piece.w/2,piece.h/2);
    tc.rotate(rad);
    if(piece.flipHProg) tc.scale(flipScale(piece.flipHProg),1);
    if(piece.flipVProg) tc.scale(1,flipScale(piece.flipVProg));
    tc.globalAlpha=opacity;
    tc.globalCompositeOperation=blendMode;
    tc.drawImage(src,-piece.w/2,-piece.h/2,piece.w,piece.h);
    tc.restore();
    // draw blended result onto pieceCanvas
    pCtx.save();
    pCtx.shadowColor='rgba(0,0,0,0.3)';pCtx.shadowBlur=8;
    pCtx.drawImage(tmp,piece.floatX,piece.floatY);
    pCtx.restore();
  } else {
    // normal mode — just draw piece
    pCtx.save();
    pCtx.globalAlpha=opacity;
    pCtx.shadowColor='rgba(0,0,0,0.4)';pCtx.shadowBlur=10;pCtx.shadowOffsetX=3;pCtx.shadowOffsetY=3;
    pCtx.translate(cx,cy);
    pCtx.rotate(rad);
    if(piece.flipHProg) pCtx.scale(flipScale(piece.flipHProg),1);
    if(piece.flipVProg) pCtx.scale(1,flipScale(piece.flipVProg));
    pCtx.drawImage(src,-piece.w/2,-piece.h/2,piece.w,piece.h);
    pCtx.restore();
  }

  // dashed border
  pCtx.save();
  pCtx.globalAlpha=0.7;
  pCtx.setLineDash([5,4]);
  pCtx.strokeStyle='#e94560';pCtx.lineWidth=1.5;
  pCtx.strokeRect(piece.floatX,piece.floatY,piece.w,piece.h);
  pCtx.setLineDash([]);
  pCtx.restore();
}

// ── PIECE DRAG ──
PC.addEventListener('pointerdown',onPieceDown,{passive:false});
PC.addEventListener('pointermove',onPieceMove,{passive:false});
PC.addEventListener('pointerup',  onPieceUp,  {passive:false});
PC.addEventListener('pointercancel',()=>{if(piece)piece.isDragging=false;},{passive:false});

function hitPiece(x,y){
  return piece&&x>=piece.floatX&&x<=piece.floatX+piece.w&&y>=piece.floatY&&y<=piece.floatY+piece.h;
}
function onPieceDown(e){
  if(!piece)return;
  e.preventDefault();e.stopPropagation();
  const[x,y]=getPos(e,PC);
  if(!hitPiece(x,y))return;
  piece.isDragging=true;
  piece.dsx=x;piece.dsy=y;piece.dox=piece.floatX;piece.doy=piece.floatY;
  try{PC.setPointerCapture(e.pointerId);}catch(ex){}
  PC.style.cursor='grabbing';
  closePieceControlRow();
}
function onPieceMove(e){
  if(!piece||!piece.isDragging)return;
  e.preventDefault();e.stopPropagation();
  const[x,y]=getPos(e,PC);
  piece.floatX=piece.dox+(x-piece.dsx);
  piece.floatY=piece.doy+(y-piece.dsy);
  redrawPiece();
}
function onPieceUp(e){
  if(!piece||!piece.isDragging)return;
  e.preventDefault();e.stopPropagation();
  piece.isDragging=false;
  PC.style.cursor='grab';
  showPieceBar(); // update position but don't stamp — user stamps manually
}

function stampPiece(){
  if(!piece)return;
  const src=document.createElement('canvas');
  src.width=piece.w; src.height=piece.h;
  src.getContext('2d').putImageData(piece.imageData,0,0);

  const cx=piece.floatX+piece.w/2;
  const cy=piece.floatY+piece.h/2;
  const rad=piece.angle*Math.PI/180;

  ctx.save();
  ctx.globalAlpha = piece.xray ? 1 : (piece.opacity||1);
  ctx.globalCompositeOperation=piece.blendMode||'source-over';
  ctx.translate(cx,cy);
  ctx.rotate(rad);
  if(piece.flipHProg) ctx.scale(flipScale(piece.flipHProg),1);
  if(piece.flipVProg) ctx.scale(1,flipScale(piece.flipVProg));
  ctx.drawImage(src,-piece.w/2,-piece.h/2,piece.w,piece.h);
  ctx.restore();

  piece=null;
  pCtx.clearRect(0,0,PC.width,PC.height);
  PC.style.display='none';
  PC.style.pointerEvents='none';
  hidePieceEditUI();
  document.getElementById('angleBadge').style.display='none';
  showToast('📌 הודבק');
}

function rotatePiece(deg){
  if(!piece) return;
  piece.angle=deg;
  document.getElementById('pieceRVal').textContent=Math.round(deg)+'°';
  updateAngleBadge();
  redrawPiece();
}

function updateRotVal(){
  const el=document.getElementById('rotVal');
  if(!el) return;
  const deg=mode==='ruler'
    ? Math.round(((R.angle*180/Math.PI)%360+360)%360)
    : Math.round(((C.needle*180/Math.PI)%360+360)%360);
  el.textContent=deg+'°';
}
function rotateToolBy(deg){
  const rad=deg*Math.PI/180;
  if(mode==='ruler'){
    R.angle+=rad;
    drawRulerOverlay();
  } else if(mode==='compass'){
    C.needle+=rad; C.pencil+=rad;
    drawCompassOverlay();
  }
  updateRotVal();
}

function moveRulerPerp(dir){
  // 1/10 mm in pixels at 96dpi = 96/25.4/10
  const step=96/25.4/10; // ≈ 0.378px
  const{px,py}=rulerPerp();
  R.pos.x+=px*step*dir;
  R.pos.y+=py*step*dir;
  drawRulerOverlay();
}

function updateAngleBadge(){
  const badge=document.getElementById('angleBadge');
  if(!piece){ badge.style.display='none'; return; }
  badge.style.display='block';
  badge.textContent='↻ '+Math.round(piece.angle||0)+'°';
}

function setFlipProgress(axis,val){
  if(!piece) return;
  if(axis==='h'){
    piece.flipHProg=val;
    document.getElementById('pieceFlipHVal').textContent=Math.round(val)+'%';
  } else {
    piece.flipVProg=val;
    document.getElementById('pieceFlipVVal').textContent=Math.round(val)+'%';
  }
  redrawPiece();
}

function setBlend(mode){
  if(!piece) return;
  piece.blendMode=mode;
  // update active button
  ['blendNormal','blendMultiply','blendScreen'].forEach(id=>
    document.getElementById(id).classList.remove('active'));
  const map={'source-over':'blendNormal','multiply':'blendMultiply','screen':'blendScreen'};
  if(map[mode]) document.getElementById(map[mode]).classList.add('active');
  redrawPiece();
}

function setPieceOpacity(val){
  if(!piece) return;
  piece.opacity=val/100;
  document.getElementById('pieceOpacityVal').textContent=val+'%';
  redrawPiece();
}

function toggleXray(){
  if(!piece) return;
  piece.xray=!piece.xray;
  document.getElementById('btnXray').classList.toggle('active', piece.xray);
  redrawPiece();
  showToast(piece.xray ? '🔍 X-Ray — גרור למיקום, קבע להדבקה אטומה' : '🔍 X-Ray כבוי');
}

// ── FLOOD FILL ──
function hexToRgb(h){const v=h.replace('#','');const n=parseInt(v.length===3?v.split('').map(c=>c+c).join(''):v,16);return[(n>>16)&255,(n>>8)&255,n&255,255];}
function clrMatch(d,i,t,tol){return Math.abs(d[i]-t[0])<=tol&&Math.abs(d[i+1]-t[1])<=tol&&Math.abs(d[i+2]-t[2])<=tol&&Math.abs(d[i+3]-t[3])<=tol;}
function floodFill(e){
  const[fx,fy]=getPos(e);
  const W=MC.width,H=MC.height;
  // collect all points to fill (original + mirrored)
  const pts=[{x:Math.round(fx),y:Math.round(fy)}];
  if(mirrorH) pts.push({x:W-1-Math.round(fx),y:Math.round(fy)});
  if(mirrorV) pts.push({x:Math.round(fx),y:H-1-Math.round(fy)});
  if(mirrorH&&mirrorV) pts.push({x:W-1-Math.round(fx),y:H-1-Math.round(fy)});

  const img=ctx.getImageData(0,0,W,H);const d=img.data;
  const fill=hexToRgb(color);

  for(const{x:x0,y:y0} of pts){
    if(x0<0||y0<0||x0>=W||y0>=H) continue;
    const si=(y0*W+x0)*4;
    const tgt=[d[si],d[si+1],d[si+2],d[si+3]];
    if(clrMatch(d,si,fill,10)) continue;
    const vis=new Uint8Array(W*H);const stk=[x0+y0*W];vis[x0+y0*W]=1;
    while(stk.length){
      const pos=stk.pop();const px=pos%W,py=(pos-px)/W,idx=pos*4;
      d[idx]=fill[0];d[idx+1]=fill[1];d[idx+2]=fill[2];d[idx+3]=255;
      [[pos-1,px>0],[pos+1,px<W-1],[pos-W,py>0],[pos+W,py<H-1]].forEach(([n,ok])=>{
        if(ok&&!vis[n]&&clrMatch(d,n*4,tgt,30)){vis[n]=1;stk.push(n);}
      });
    }
  }
  ctx.putImageData(img,0,0);showToast('🪣 מולא!');
}

// ── TEXT ──
function handleTextClick(e){
  const[x,y]=getPos(e);commitText();
  textX=x;textY=y;
  const cr=MC.getBoundingClientRect();
  overlay.style.display='block';overlay.style.left=(cr.left+x)+'px';overlay.style.top=(cr.top+y)+'px';
  tinput.style.fontSize=fontSize+'px';tinput.style.color=color;
  tinput.value='';tinput.style.width='160px';
  setTimeout(()=>tinput.focus(),80);
}
tinput.addEventListener('input',()=>{tinput.style.width=Math.max(90,tinput.scrollWidth+14)+'px';});
tinput.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();commitText();}});
function commitText(){
  if(overlay.style.display==='none')return;
  overlay.style.display='none';
  const txt=tinput.value.trim();if(!txt)return;
  createTextLabel(txt,textX,textY,color,fontSize);
}
function createTextLabel(txt,cx,cy,c,fs){
  const cr=MC.getBoundingClientRect();
  const el=document.createElement('div');el.className='text-label';el.textContent=txt;
  el.style.cssText=`left:${cr.left+cx}px;top:${cr.top+cy}px;font-size:${fs}px;color:${c};font-family:Heebo,sans-serif;`;
  const del=document.createElement('button');del.className='del-btn';del.textContent='×';
  del.addEventListener('pointerdown',ev=>{ev.stopPropagation();el.remove();showToast('נמחק');});
  el.appendChild(del);document.body.appendChild(el);makeDraggable(el);
  el.addEventListener('pointerdown',ev=>{if(ev.target===del)return;deselectLabels();el.classList.add('selected');activeLabel=el;ev.stopPropagation();});
}
function deselectLabels(){document.querySelectorAll('.text-label').forEach(l=>l.classList.remove('selected'));activeLabel=null;}
function makeDraggable(el){
  let ox=0,oy=0,sx=0,sy=0,drag=false;
  el.addEventListener('pointerdown',e=>{if(e.target.classList.contains('del-btn'))return;drag=true;try{el.setPointerCapture(e.pointerId);}catch(ex){}sx=e.clientX;sy=e.clientY;ox=parseFloat(el.style.left)||0;oy=parseFloat(el.style.top)||0;e.stopPropagation();},{passive:false});
  el.addEventListener('pointermove',e=>{if(!drag)return;el.style.left=(ox+e.clientX-sx)+'px';el.style.top=(oy+e.clientY-sy)+'px';e.stopPropagation();},{passive:false});
  el.addEventListener('pointerup',e=>{drag=false;e.stopPropagation();});
  el.addEventListener('pointercancel',()=>{drag=false;});
}

// ── FLATTEN ──
function getFlatCanvas(){
  const tmp=document.createElement('canvas');tmp.width=MC.width;tmp.height=MC.height;
  const tc=tmp.getContext('2d');tc.fillStyle='#fff';tc.fillRect(0,0,tmp.width,tmp.height);
  tc.drawImage(MC,0,0);
  if(piece){const t2=document.createElement('canvas');t2.width=piece.w;t2.height=piece.h;t2.getContext('2d').putImageData(piece.imageData,0,0);tc.drawImage(t2,piece.floatX,piece.floatY);}
  const cr=MC.getBoundingClientRect();
  document.querySelectorAll('.text-label').forEach(el=>{
    const fs=parseFloat(el.style.fontSize)||22,clr=el.style.color||'#000';
    const txt=el.childNodes[0]?el.childNodes[0].textContent:'';
    const lx=parseFloat(el.style.left)-cr.left,ly=parseFloat(el.style.top)-cr.top;
    tc.font=`${fs}px Heebo,sans-serif`;tc.fillStyle=clr;tc.textBaseline='top';tc.direction='rtl';
    tc.fillText(txt,lx+el.offsetWidth,ly);
  });
  return tmp;
}

// ── PASTE FROM SYSTEM CLIPBOARD ──
async function pasteFromClipboard(){
  // if there's already a floating piece — stamp it
  if(piece){ stampPiece(); showToast('📌 הודבק!'); return; }

  // otherwise try system clipboard
  if(navigator.clipboard && navigator.clipboard.read){
    try{
      const items=await navigator.clipboard.read();
      for(const item of items){
        const imgType=item.types.find(t=>t.startsWith('image/'));
        if(imgType){
          const blob=await item.getType(imgType);
          pasteImageBlob(blob);
          return;
        }
      }
      showToast('⚠️ אין תמונה בהעתקה — נסה לבחור קובץ');
    }catch(e){
      showToast('⚠️ אין הרשאה לקליפבורד — בחר קובץ');
    }
  } else {
    showToast('הדבקה אוטומטית לא נתמכת — בחר קובץ');
  }
  // fallback: open file picker
  document.getElementById('pasteFileInput').click();
}

function pasteImageBlob(blob){
  const url=URL.createObjectURL(blob);
  const img=new Image();
  img.onload=()=>{
    const scale=Math.min(1, MC.width/img.width, MC.height/img.height);
    const dw=Math.round(img.width*scale), dh=Math.round(img.height*scale);
    const px=Math.round((MC.width-dw)/2), py=Math.round((MC.height-dh)/2);

    // render image to a canvas to get imageData
    const tmp=document.createElement('canvas');
    tmp.width=dw; tmp.height=dh;
    tmp.getContext('2d').drawImage(img,0,0,dw,dh);
    const imgData=tmp.getContext('2d').getImageData(0,0,dw,dh);

    // commit any existing floating piece first
    if(piece) stampPiece();

    piece={
      imageData:imgData,
      origImageData:imgData,
      origX:px, origY:py, w:dw, h:dh,
      floatX:px, floatY:py,
      angle:0, flipHProg:0, flipVProg:0,
      blendMode:'source-over', opacity:1, xray:false,
      isDragging:false, dsx:0, dsy:0, dox:0, doy:0
    };

    PC.style.display='block';
    PC.style.pointerEvents='auto';
    PC.style.cursor='grab';
    redrawPiece();
    showPieceBar();
    URL.revokeObjectURL(url);
    showToast('🖼️ הודבקה — גרור למיקום, שנה גודל, ואז 📌 קבע');
  };
  img.onerror=()=>{ URL.revokeObjectURL(url); showToast('⚠️ שגיאה בטעינת התמונה'); };
  img.src=url;
}

function loadImageFile(input,replace){
  const file=input.files[0];if(!file)return;
  if(!replace){
    // paste as floating piece
    pasteImageBlob(file);
    input.value='';
    return;
  }
  const url=URL.createObjectURL(file);
  const img=new Image();

}

// ── FOLDER HANDLE (persists in IndexedDB across sessions) ──
let savedFolderHandle=null;

async function getSavedFolder(){
  // try IndexedDB first
  try{
    const db=await new Promise((res,rej)=>{
      const r=indexedDB.open('drawCanvas',2);
      r.onupgradeneeded=e=>{ try{e.target.result.createObjectStore('settings');}catch(ex){} };
      r.onsuccess=e=>res(e.target.result);
      r.onerror=rej;
    });
    const tx=db.transaction('settings','readonly');
    const handle=await new Promise((res,rej)=>{
      const r=tx.objectStore('settings').get('folderHandle');
      r.onsuccess=e=>res(e.target.result);
      r.onerror=rej;
    });
    if(handle){
      // verify permission
      const perm=await handle.queryPermission({mode:'readwrite'});
      if(perm==='granted') return handle;
      const req=await handle.requestPermission({mode:'readwrite'});
      if(req==='granted') return handle;
    }
  }catch(e){}
  return null;
}

async function saveFolderHandle(handle){
  try{
    const db=await new Promise((res,rej)=>{
      const r=indexedDB.open('drawCanvas',2);
      r.onupgradeneeded=e=>{ try{e.target.result.createObjectStore('settings');}catch(ex){} };
      r.onsuccess=e=>res(e.target.result);
      r.onerror=rej;
    });
    const tx=db.transaction('settings','readwrite');
    tx.objectStore('settings').put(handle,'folderHandle');
  }catch(e){}
}

async function pickSaveFolder(){

    savedFolderHandle=handle;
    await saveFolderHandle(handle);
    showToast('📁 תיקייה נבחרה: '+handle.name+' — כל השמירות יגיעו לכאן');
  }catch(e){ if(e.name!=='AbortError') showToast('⚠️ לא נבחרה תיקייה'); }
}

async function saveImage(filename){
  filename=filename||'ציור.png';
  const dataURL=getFlatCanvas().toDataURL('image/png');
  const bs=atob(dataURL.split(',')[1]);
  const arr=new Uint8Array(bs.length);
  for(let i=0;i<bs.length;i++) arr[i]=bs.charCodeAt(i);
  const blob=new Blob([arr],{type:'image/png'});

  // Method 1: saved folder handle (user picked folder once)
  if(!savedFolderHandle) savedFolderHandle=await getSavedFolder();
  if(savedFolderHandle){
    try{
      const fh=await savedFolderHandle.getFileHandle(filename,{create:true});
      const w=await fh.createWritable(); await w.write(blob); await w.close();
      showToast('💾 נשמר ב-'+savedFolderHandle.name+': '+filename); return;
    }catch(e){ savedFolderHandle=null; } // if failed, fall through
  }

  // Method 2: blob URL download
  try{
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url; a.download=filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url),5000);
    showToast('💾 נשמר: '+filename); return;
  }catch(e){}

  // Method 3: Web Share API
  const sf=new File([blob],filename,{type:'image/png'});
  if(navigator.canShare&&navigator.canShare({files:[sf]})){
    try{ await navigator.share({files:[sf],title:filename}); showToast('✅ שותף!'); return; }
    catch(e){ if(e.name==='AbortError') return; }
  }

  showToast('⚠️ שמירה לא נתמכת');
}

async function downloadCanvas(){
  const now=new Date();
  const pad=n=>String(n).padStart(2,'0');
  const def=`ציור ${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())} ${pad(now.getHours())}-${pad(now.getMinutes())}`;
  const inp=prompt('שם הקובץ:', def);
  if(inp===null) return;
  const chosen=inp.trim()||def;
  const filename=chosen.replace(/[\\/:*?"<>|]/g,'_');
  const fn=filename.endsWith('.png')?filename:filename+'.png';
  await saveImage(fn);
}

function scalePiece(pct){
  if(!piece||!piece._scaleOrigW) return;
  const ratio=pct/100;
  const newW=Math.max(10,Math.round(piece._scaleOrigW*ratio));
  const newH=Math.max(10,Math.round(piece._scaleOrigH*ratio));
  // scale from origImageData
  const tmp=document.createElement('canvas');
  tmp.width=piece.origImageData.width; tmp.height=piece.origImageData.height;
  tmp.getContext('2d').putImageData(piece.origImageData,0,0);
  const scaled=document.createElement('canvas');
  scaled.width=newW; scaled.height=newH;
  const sc=scaled.getContext('2d');
  sc.imageSmoothingEnabled=true; sc.imageSmoothingQuality='high';
  sc.drawImage(tmp,0,0,newW,newH);
  piece.imageData=sc.getImageData(0,0,newW,newH);
  // keep center fixed
  const cx=piece.floatX+piece.w/2;
  const cy=piece.floatY+piece.h/2;
  piece.w=newW; piece.h=newH;
  piece.floatX=cx-newW/2;
  piece.floatY=cy-newH/2;
  document.getElementById('pieceScaleVal').textContent=pct+'%';
  redrawPiece();
}

  scatterAllPlaced.forEach(({px,py,drawR,rot,col,filled,obj})=>{
    ctx.fillStyle=col; ctx.strokeStyle=col;
    if(obj){
      ctx.save(); ctx.translate(px,py); ctx.rotate(rot);
      ctx.drawImage(obj,-drawR,-drawR,drawR*2,drawR*2);
      ctx.restore();
    } else {
      ctx.beginPath(); ctx.arc(px,py,drawR,0,Math.PI*2);
      if(filled) ctx.fill(); else ctx.stroke();
    }
  });
  scatterCheckpoint=null;
  scatterAllPlaced=[];
  const b=document.getElementById('scatterMarkBtn');
  if(b){b.textContent='📍';b.style.color='';}
  showToast('🗑 מסגרת הוסרה');
}

function doScatterFill(cx,cy){
  // snapshot inkCanvas BEFORE drawing dots (for border removal)
  iCtx.clearRect(0,0,IKC.width,IKC.height);
  iCtx.fillStyle='#fff'; iCtx.fillRect(0,0,IKC.width,IKC.height);
  iCtx.drawImage(MC,0,0);
  const mask=radiantFloodFill(cx,cy);
  if(!mask){showToast('⚠️ גע בתוך שטח מוקף בקו');return;}
  const snapBeforeBorder=ctx.getImageData(0,0,MC.width,MC.height);
  saveHistory();
  const{mw,mh,scale,reachable}=mask;
  let x0=mw,y0=mh,x1=0,y1=0;
  for(let y=0;y<mh;y++) for(let x=0;x<mw;x++){
    if(reachable[y*mw+x]){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y;}
  }
  // collect placed items without drawing yet
  const r=scatterSize;
  const isObjMode=!!(scatterUseObj&&scatterObj);
  const marginMask=Math.ceil(r*scale*1.5)+2;
  const placedList=[];
  const allPrev=scatterAllPlaced.map(p=>({px:p.px,py:p.py,drawR:p.drawR,isObj:p.isObj||false}));

  // if count=1, place exactly at touch point
  if(scatterCount===1){
    const inMask=()=>{
      const mx=Math.floor(cx*scale), my=Math.floor(cy*scale);
      return mx>=0&&my>=0&&mx<mw&&my<mh&&reachable[my*mw+mx]===1;
    };
    if(!inMask()){showToast('⚠️ גע בתוך הצורה');return;}
    const overlaps=allPrev.some(p=>Math.hypot(cx-p.px,cy-p.py)<r+p.drawR);
    if(overlaps){showToast('⚠️ מקום תפוס');return;}
    const rot=Math.random()*Math.PI*2;
    placedList.push({px:cx,py:cy,drawR:r,rot,isObj:isObjMode});
    scatterAllPlaced.push({px:cx,py:cy,drawR:r,rot,col:color,filled:scatterFilled,obj:isObjMode?scatterObj:null,isObj:isObjMode});
  } else {
  let placed=0, tries=0;
  while(placed<scatterCount && tries<Math.max(200,scatterCount*50)){
    tries++;
    const mx=x0+marginMask+Math.random()*(x1-x0-marginMask*2);
    const my=y0+marginMask+Math.random()*(y1-y0-marginMask*2);
    if(mx<0||my<0) continue;
    const corners=[
      [Math.floor(mx-marginMask),Math.floor(my-marginMask)],
      [Math.floor(mx+marginMask),Math.floor(my-marginMask)],
      [Math.floor(mx-marginMask),Math.floor(my+marginMask)],
      [Math.floor(mx+marginMask),Math.floor(my+marginMask)],
      [Math.floor(mx),Math.floor(my)]
    ];
    const ok=corners.every(([cx2,cy2])=>
      cx2>=0&&cy2>=0&&cx2<mw&&cy2<mh&&reachable[cy2*mw+cx2]===1
    );
    if(!ok) continue;
    const px=mx/scale, py=my/scale;
    const isObj=isObjMode;
    const checkR=isObj ? r*3 : r*2;
    const allCheck=[...allPrev,...placedList];
    const overlaps=allCheck.some(p=>{
      const dist=Math.hypot(px-p.px,py-p.py);
      if(isObj&&p.isObj) return dist<r+p.drawR;      // obj vs obj
      if(!isObj&&!p.isObj) return dist<r+p.drawR;    // dot vs dot
      return dist<(r+p.drawR)*0.7;                   // mixed — relaxed
    });
    if(overlaps) continue;
    const rot=Math.random()*Math.PI*2;
    placedList.push({px,py,r:checkR,drawR:r,rot,isObj});
    scatterAllPlaced.push({px,py,drawR:r,rot,col:color,filled:scatterFilled,obj:scatterUseObj?scatterObj:null,isObj});
    placed++;
  }
  } // end else
  // draw all items on clean canvas
  ctx.fillStyle=color; ctx.strokeStyle=color; ctx.lineWidth=1;
  placedList.forEach(({px,py,drawR,rot})=>{
    if(scatterUseObj&&scatterObj){
      ctx.save();
      ctx.translate(px,py);
      ctx.rotate(rot);
      ctx.drawImage(scatterObj,-drawR,-drawR,drawR*2,drawR*2);
      ctx.restore();
    } else {
      ctx.beginPath(); ctx.arc(px,py,drawR,0,Math.PI*2);
      if(scatterFilled) ctx.fill(); else ctx.stroke();
    }
  });
  showToast(`✦ ${placed} פוזרו`);
}

function buildInkMask(){
  const mw=380, scale=mw/IKC.width, mh=Math.round(IKC.height*scale);
  const small=document.createElement('canvas');
  small.width=mw; small.height=mh;
  small.getContext('2d').drawImage(IKC,0,0,mw,mh);
  const data=small.getContext('2d').getImageData(0,0,mw,mh).data;
  const bright=new Float32Array(mw*mh);
  for(let i=0;i<mw*mh;i++)
    bright[i]=(data[i*4]+data[i*4+1]+data[i*4+2])/3;
  const edge=new Uint8Array(mw*mh);
  for(let y=1;y<mh-1;y++){
    for(let x=1;x<mw-1;x++){
      const i=y*mw+x, b=bright[i];
      if(Math.abs(b-bright[i-1])>30||Math.abs(b-bright[i+1])>30||
         Math.abs(b-bright[i-mw])>30||Math.abs(b-bright[i+mw])>30)
        edge[i]=1;
    }
  }
  // dilate edge by 1px to close small gaps
  const isInk=new Uint8Array(mw*mh);
  const r=1;
  for(let y=0;y<mh;y++){
    for(let x=0;x<mw;x++){
      if(!edge[y*mw+x]) continue;
      for(let dy=-r;dy<=r;dy++) for(let dx=-r;dx<=r;dx++){
        const nx=x+dx, ny=y+dy;
        if(nx>=0&&ny>=0&&nx<mw&&ny<mh) isInk[ny*mw+nx]=1;
      }
    }
  }
  return{mw,mh,scale,isInk};
}

function radiantFloodFill(cx,cy){
  const{mw,mh,scale,isInk}=buildInkMask();
  const startX=Math.floor(cx*scale), startY=Math.floor(cy*scale);
  if(startX<0||startY<0||startX>=mw||startY>=mh) return null;
  if(isInk[startY*mw+startX]) return null;
  const reachable=new Uint8Array(mw*mh);
  const queue=new Int32Array(mw*mh);
  let qHead=0,qTail=0;
  const si=startY*mw+startX; reachable[si]=1; queue[qTail++]=si;
  let hitEdge=false;
  while(qHead<qTail){
    const idx=queue[qHead++]; const x=idx%mw, y=(idx/mw)|0;
    if(x===0||x===mw-1||y===0||y===mh-1) hitEdge=true;
    [[idx-1,x>0],[idx+1,x<mw-1],[idx-mw,y>0],[idx+mw,y<mh-1]].forEach(([ni,ok])=>{
      if(ok&&!isInk[ni]&&!reachable[ni]){reachable[ni]=1;queue[qTail++]=ni;}
    });
  }
  if(hitEdge) return null; // shape not closed
  return{mw,mh,scale,reachable};
}

function maskAllows(mask,x,y){
  if(x<0||y<0||x>MC.width||y>MC.height) return false;
  const mx=Math.floor(x*mask.scale), my=Math.floor(y*mask.scale);
  if(mx<0||my<0||mx>=mask.mw||my>=mask.mh) return false;
  return mask.reachable[my*mask.mw+mx]===1;
}

function doRadiantFill(cx,cy){
  const mask=radiantFloodFill(cx,cy);
  if(!mask){showToast('⚠️ וודא שהצורה סגורה לגמרי ונגע בתוכה');return;}
  saveHistory();
  ctx.fillStyle=color;
  const angleStep=(Math.PI*2)/radiantRayCount;
  for(let a=0;a<radiantRayCount;a++){
    const angle=a*angleStep, dx=Math.cos(angle), dy=Math.sin(angle);
    let step=1;
    while(step<3000){
      const dist=step*radiantStepDist;
      const x=cx+dx*dist, y=cy+dy*dist;
      if(!maskAllows(mask,x,y)) break;
      const size=radiantStartSize+step*radiantGrowth;
      ctx.beginPath(); ctx.arc(x,y,Math.max(size,1)/2,0,Math.PI*2); ctx.fill();
      step++;
    }
  }
  showToast('✨ מילוי קורן הושלם');
}

const mixColors=[null,null,null,null]; // hex or null
let mixResult=null;

function hexToRgbArr(hex){
  const r=parseInt(hex.slice(1,3),16);
  const g=parseInt(hex.slice(3,5),16);
  const b=parseInt(hex.slice(5,7),16);
  return[r,g,b];
}

function doColorMix(){
  const filled=mixColors.filter(c=>c!==null);
  if(filled.length<2){showToast('⚠️ מלא לפחות 2 מרובעים');return;}
  let r=0,g=0,b=0;
  filled.forEach(hex=>{
    const[cr,cg,cb]=hexToRgbArr(hex);
    r+=cr; g+=cg; b+=cb;
  });
  r=Math.round(r/filled.length);
  g=Math.round(g/filled.length);
  b=Math.round(b/filled.length);
  mixResult='#'+[r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('');
  document.getElementById('mixResult').style.background=mixResult;
  // set as current color
  setColorFromHex(mixResult);
  showToast('🎨 צבע מעורבב: '+mixResult);
}

function saveMixColor(){
  if(!mixResult){showToast('⚠️ ערבב תחילה');return;}
  addSwatch(mixResult, true);
  try{
    const arr=JSON.parse(localStorage.getItem('savedSwatches')||'[]');
    if(!arr.includes(mixResult)){
      arr.push(mixResult);
      localStorage.setItem('savedSwatches',JSON.stringify(arr));
    }
  }catch(e){}
  showToast('✅ צבע נשמר בטבלה');
}

function addSwatch(hex, deletable){
  const bar=document.getElementById('topBar');
  if(bar.querySelector(`.swatch[data-color="${hex}"]`)) return;
  const sw=document.createElement('div');
  sw.className='swatch'+(deletable?' saved-swatch':'');
  sw.style.background=hex;
  sw.dataset.color=hex;
  sw.onclick=function(){setSwatch(this);};
  if(deletable){
    let pressTimer=null;
    sw.addEventListener('pointerdown',()=>{
      pressTimer=setTimeout(()=>{
        pressTimer=null;
        // custom confirm
        const overlay=document.createElement('div');
        overlay.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:200;display:flex;align-items:center;justify-content:center;';
        overlay.innerHTML=`<div style="background:#16213e;border:2px solid #e94560;border-radius:16px;padding:20px 24px;text-align:center;font-family:Heebo,sans-serif;color:#fff;direction:rtl;">
          <div style="width:40px;height:40px;border-radius:8px;background:${hex};margin:0 auto 12px;border:2px solid #fff;"></div>
          <div style="font-size:14px;margin-bottom:16px;">למחוק צבע זה?</div>
          <div style="display:flex;gap:10px;justify-content:center;">
            <button id="delYes" style="background:#e94560;border:none;color:#fff;padding:8px 20px;border-radius:10px;font-size:14px;cursor:pointer;font-family:Heebo,sans-serif;">מחק</button>
            <button id="delNo" style="background:#0f3460;border:1.5px solid #2a2a4a;color:#fff;padding:8px 20px;border-radius:10px;font-size:14px;cursor:pointer;font-family:Heebo,sans-serif;">בטל</button>
          </div>
        </div>`;
        document.body.appendChild(overlay);
        overlay.querySelector('#delNo').onclick=()=>document.body.removeChild(overlay);
        overlay.querySelector('#delYes').onclick=()=>{
          document.body.removeChild(overlay);
          deleteSavedSwatch(hex,sw);
        };
      },600);
    },{passive:true});
    sw.addEventListener('pointerup',()=>clearTimeout(pressTimer),{passive:true});
    sw.addEventListener('pointercancel',()=>clearTimeout(pressTimer),{passive:true});
  }
  const swatches=bar.querySelectorAll('.swatch');
  const last=swatches[swatches.length-1];
  if(last) last.after(sw); else bar.prepend(sw);
}

function deleteSavedSwatch(hex, el){
  el.remove();
  try{
    const arr=JSON.parse(localStorage.getItem('savedSwatches')||'[]');
    localStorage.setItem('savedSwatches',JSON.stringify(arr.filter(c=>c!==hex)));
  }catch(e){}
  showToast('🗑 צבע הוסר');
}

function loadSavedSwatches(){
  try{
    const data=localStorage.getItem('savedSwatches');
    if(!data) return;
    JSON.parse(data).forEach(hex=>addSwatch(hex, true));
  }catch(e){}
}

function openSortPanel(){
  const bar=document.getElementById('bottomBar');
  const list=document.getElementById('sortList');
  list.innerHTML='';
  let btnIdx=0;
  [...bar.children].forEach((el)=>{
    const icon=el.querySelector('.icon');
    const lbl=el.querySelector('.lbl');
    if(!icon&&!lbl) return;
    const text=(icon?icon.textContent:'')+' '+(lbl?lbl.textContent:'');
    const idx=btnIdx++;
    const row=document.createElement('div');
    row.style.cssText='display:flex;align-items:center;gap:8px;background:#0f3460;border-radius:10px;padding:10px 12px;';
    row.innerHTML=`<span style="flex:1;color:#fff;font-size:14px;">${text.trim()}</span>`;
    const btnUp=document.createElement('button');
    btnUp.textContent='↑';
    btnUp.style.cssText='background:#16213e;border:1px solid #2a2a4a;color:#fff;border-radius:8px;width:34px;height:34px;font-size:16px;cursor:pointer;';
    btnUp.addEventListener('click',()=>{
      if(el.previousElementSibling) el.previousElementSibling.before(el);
      openSortPanel();
    });
    const btnDn=document.createElement('button');
    btnDn.textContent='↓';
    btnDn.style.cssText=btnUp.style.cssText;
    btnDn.addEventListener('click',()=>{
      if(el.nextElementSibling) el.nextElementSibling.after(el);
      openSortPanel();
    });
    row.appendChild(btnUp);
    row.appendChild(btnDn);
    list.appendChild(row);
  });
  document.getElementById('sortPanel').style.display='block';
}

function exportSettings(){
  const settings={
    bbSortOrder: localStorage.getItem('bbSortOrder'),
    savedSwatches: localStorage.getItem('savedSwatches')
  };
  const blob=new Blob([JSON.stringify(settings,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='JustDraw_settings.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);
  showToast('📤 הגדרות יוצאו');

function importSettings(){
  const inp=document.createElement('input');
  inp.type='file'; inp.accept='.json';
  inp.onchange=e=>{
    const file=e.target.files[0]; if(!file) return;
    const reader=new FileReader();
    reader.onload=ev=>{
      try{
        const s=JSON.parse(ev.target.result);
        if(s.bbSortOrder) localStorage.setItem('bbSortOrder',s.bbSortOrder);
        if(s.savedSwatches) localStorage.setItem('savedSwatches',s.savedSwatches);
        showToast('📥 הגדרות יובאו — טוען מחדש...');
        setTimeout(()=>location.reload(),1000);
      }catch(e){showToast('⚠️ שגיאה בקובץ');}
    };
    reader.readAsText(file);
  };
  document.body.appendChild(inp); inp.click(); document.body.removeChild(inp);
}

function showToast(msg){
  const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2400);
}

// ── INTERCEPT BACK BUTTON ──
history.pushState({page:'draw'}, '');
window.addEventListener('popstate', ()=>{
  const choice=confirm('לצאת מלוח הציור?');

  // save synchronously — no async, no Web Share (which needs user gesture)
  try{
    const tmp=document.createElement('canvas');
    tmp.width=MC.width; tmp.height=MC.height;
    const tc=tmp.getContext('2d');
    tc.fillStyle='#fff'; tc.fillRect(0,0,tmp.width,tmp.height);
    tc.drawImage(MC,0,0);
    const url=tmp.toDataURL('image/png');
    const a=document.createElement('a');
    a.href=url; a.download='ציור.png';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
  }catch(e){ showToast('שגיאה: '+e.message); }

  if(choice){
    setTimeout(()=>history.go(-1), 600);
  } else {
    history.pushState({page:'draw'}, '');
  }
});

// ── iOS SAFARI FIXES ──
// Prevent default touch behavior on canvas (stops iOS scroll/zoom interfering with drawing)
document.addEventListener('touchstart', e=>{
  if(e.target===MC||e.target===PC||e.target===SC) e.preventDefault();
},{passive:false});
document.addEventListener('touchmove', e=>{
  if(e.target===MC||e.target===PC||e.target===SC) e.preventDefault();
  // also prevent if dragging a handle
  if(dragHandle) e.preventDefault();
},{passive:false});

// iOS: re-layout on orientation change (Safari fires resize late)
window.addEventListener('orientationchange',()=>{
  setTimeout(()=>{ layout(); }, 300);
  setTimeout(()=>{ layout(); }, 600); // double fire for safety
});

// iOS: prevent rubber-band scroll on body
document.body.addEventListener('touchmove', e=>{
  if(e.target===document.body) e.preventDefault();
},{passive:false});

(function(){

  </svg>`;

  const manifest = {

  const manifestBlob = new Blob([JSON.stringify(manifest)], {type:'application/json'});

})();
