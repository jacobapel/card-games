build.yml.name: Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'card-games-apk.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack project
        run: unzip -o card-games-apk.zip -d app-src

      - name: Restore signing key from the repository secret
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "Secret KEYSTORE_BASE64 is missing"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > app-src/card-games.keystore

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Build signed APK
        working-directory: app-src
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: card-games-apk
          path: app-src/app/build/outputs/apk/release/*.apk
