name: Make APK 5

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apk5.yml'
      - 'card-games-apk.zip'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack project
        run: |
          ls -la
          unzip -o card-games-apk.zip -d app-src

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Signing key (from the secret, or a new one if the secret is missing)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          K=app-src/card-games.keystore
          if [ -n "$KEYSTORE_BASE64" ] && echo "$KEYSTORE_BASE64" | tr -d ' \r\n' | base64 -d > $K 2>/dev/null \
             && keytool -list -keystore $K -storepass cardgames123 >/dev/null 2>&1; then
            echo "Using the key from the KEYSTORE_BASE64 secret"
          else
            echo "Secret missing or invalid - creating a new signing key"
            rm -f $K
            keytool -genkeypair -keystore $K -alias cardgames -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass cardgames123 -keypass cardgames123 -dname "CN=Jacob Apel, O=jacobapel, C=IL" -storetype PKCS12
          fi

      - name: Build signed APK
        working-directory: app-src
        run: |
          chmod +x gradlew
          echo "Android SDK: $ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          ./gradlew assembleRelease --no-daemon --stacktrace
          mkdir -p ../out && cp app/build/outputs/apk/release/*.apk ../out/card-games.apk

      - uses: actions/upload-artifact@v4
        with:
          name: install-apk
          path: out/card-games.apk
